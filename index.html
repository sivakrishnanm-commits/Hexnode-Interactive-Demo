<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Demos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #020A19 0%, #0F1B2E 50%, #1a2f4a 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 60, 245, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(235, 243, 254, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .app-wrapper {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        .sidebar {
            width: 320px;
            background: rgba(235, 243, 254, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(235, 243, 254, 0.1);
            overflow-y: auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            margin-bottom: 32px;
        }

        .sidebar-header h1 {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(135deg, #EBF3FE 0%, #FFFFFF 50%, #EBF3FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 0.9em;
            color: rgba(235, 243, 254, 0.6);
            font-weight: 300;
        }

        .demos-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .demo-item {
            background: rgba(235, 243, 254, 0.06);
            border: 1px solid rgba(235, 243, 254, 0.1);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            border-left: 3px solid transparent;
        }

        .demo-item:hover {
            background: rgba(235, 243, 254, 0.1);
            border-color: rgba(0, 60, 245, 0.3);
            transform: translateX(4px);
        }

        .demo-item.active {
            background: rgba(0, 60, 245, 0.15);
            border-color: rgba(0, 60, 245, 0.5);
            border-left-color: #003CF5;
        }

        .demo-item h3 {
            font-size: 0.95em;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .demo-item p {
            font-size: 0.8em;
            color: rgba(235, 243, 254, 0.6);
            line-height: 1.4;
            font-weight: 300;
        }

        .demo-item .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .demo-item .tag {
            display: inline-block;
            background: rgba(0, 60, 245, 0.2);
            color: #BDD7FC;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 500;
            border: 1px solid rgba(0, 60, 245, 0.3);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(235, 243, 254, 0.1);
            background: rgba(235, 243, 254, 0.03);
        }

        .content-header h2 {
            font-size: 1.8em;
            color: #FFFFFF;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .content-header p {
            font-size: 0.95em;
            color: rgba(235, 243, 254, 0.7);
            font-weight: 300;
        }

        .iframe-container {
            flex: 1;
            overflow: hidden;
            padding: 24px 32px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(235, 243, 254, 0.1);
            border-radius: 12px;
            background: rgba(235, 243, 254, 0.02);
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: rgba(235, 243, 254, 0.6);
        }

        .welcome-screen h2 {
            font-size: 2em;
            color: rgba(235, 243, 254, 0.8);
            margin-bottom: 12px;
            font-weight: 300;
        }

        .welcome-screen p {
            font-size: 1.1em;
            color: rgba(235, 243, 254, 0.5);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(235, 243, 254, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 60, 245, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 60, 245, 0.5);
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 280px;
                padding: 24px 16px;
            }

            .content-header {
                padding: 16px 24px;
            }

            .content-header h2 {
                font-size: 1.4em;
            }

            .iframe-container {
                padding: 16px 24px;
            }
        }

        @media (max-width: 768px) {
            .app-wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 150px;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid rgba(235, 243, 254, 0.1);
            }

            .sidebar-header {
                margin-bottom: 12px;
            }

            .sidebar-header h1 {
                font-size: 1.3em;
            }

            .demos-list {
                flex-direction: row;
                overflow-x: auto;
                gap: 8px;
            }

            .demo-item {
                min-width: 150px;
                padding: 12px;
            }

            .content-header {
                padding: 16px;
            }

            .content-header h2 {
                font-size: 1.2em;
            }

            .iframe-container {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Demos</h1>
                <p>Select a demo to view</p>
            </div>
            <div id="demos-list" class="demos-list">
                <div class="loading" style="color: rgba(235, 243, 254, 0.9); font-size: 0.95em;">Loading...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <h2 id="demo-title">Select a Demo</h2>
                <p id="demo-description">Choose a demo from the list to get started</p>
            </div>
            <div class="iframe-container">
                <iframe id="demo-iframe" title="Demo"></iframe>
            </div>
        </div>
    </div>

    <script>
        let demos = [];

        async function loadDemos() {
            try {
                const response = await fetch('./demos.json');
                if (!response.ok) throw new Error('Failed to load demos');
                demos = await response.json();
                renderDemosList();
                if (demos.length > 0) loadDemo(0);
            } catch (error) {
                document.getElementById('demos-list').innerHTML = `
                    <div style="color: #FF6B6B; font-size: 0.9em;">Error: ${error.message}</div>
                `;
            }
        }

        function renderDemosList() {
            const list = document.getElementById('demos-list');
            list.innerHTML = demos.map((demo, index) => `
                <div class="demo-item ${index === 0 ? 'active' : ''}" onclick="loadDemo(${index})">
                    <h3>${demo.title}</h3>
                    <p>${demo.description}</p>
                    ${demo.tags ? `
                        <div class="tags">
                            ${demo.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function loadDemo(index) {
            const demo = demos[index];
            if (!demo) return;

            document.querySelectorAll('.demo-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            document.getElementById('demo-title').textContent = demo.title;
            document.getElementById('demo-description').textContent = demo.description;
            document.getElementById('demo-iframe').src = demo.url;
        }

        loadDemos();
    </script>
</body>
</html>
